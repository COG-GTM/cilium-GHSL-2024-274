---
    # A reusable workflow designed to be called from the context of a specific
    # branch whenever a backport PR is merged. The workflow scans the backport PR
    # body to get the list of the backported PRs and updates their labels, replacing
    # all "backport-pending/<version>" with "backport-done/<version>".
    name: Update labels of backported PRs
    on:
      workflow_call:
        inputs:
          pr-body:
            required: true
            type: string
            description: "The PR description containing all the references to the backported PRs."
          branch:
            required: true
            type: string
            description: "The stable branch version."

    jobs:
      backport-label-updater:
        name: Update labels of backported PRs
        runs-on: ubuntu-latest
        permissions:
          pull-requests: write # Adding and removing labels
        env:
          body: ${{ inputs.pr-body }}
        steps:
          # The PR body is attacker-influenced, so it is never interpolated into a
          # shell command. It is parsed in JavaScript and only the extracted PR
          # numbers are handed to the next step, through the environment.
          - name: Extract the backported PR numbers
            id: pre-process
            uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
            with:
              script: |
                const { body } = process.env
                const lines = body.split(/\r?\n/)
                const prs = []
                for (let i = 0; i < lines.length - 1; i++) {
                  if (!lines[i].includes('upstream-prs')) {
                    continue
                  }
                  const numbers = lines[i + 1].split(';')[0].match(/[0-9]+/g)
                  if (numbers !== null) {
                    prs.push(...numbers)
                  }
                }
                return prs.join('\n')
              result-encoding: string

          - name: Update labels
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              PRS: ${{ steps.pre-process.outputs.result }}
              BRANCH: ${{ inputs.branch }}
            run: |
              echo "${PRS}" | while read -r pr; do
                if [ -z "${pr}" ]; then
                  continue
                fi
                echo "Removing label backport-pending/${BRANCH} from pr #${pr}."
                gh pr edit "${pr}" --repo "${GITHUB_REPOSITORY}" --remove-label "backport-pending/${BRANCH}"
                echo "Adding label backport-done/${BRANCH} to pr #${pr}."
                gh pr edit "${pr}" --repo "${GITHUB_REPOSITORY}" --add-label "backport-done/${BRANCH}"
              done
